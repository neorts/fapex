<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<title>Apex Tracker - Geçmiş</title>

<style>

body {

    margin: 0;

    background: #0d0f14;

    color: white;

    font-family: Arial;
}

.container {

    width: 1100px;

    max-width: 95%;

    margin: 40px auto;
}

.card {

    background: #171a21;

    padding: 25px;

    border-radius: 14px;
}

a {

    color: #aaa;

    text-decoration: none;
}

table {

    width: 100%;

    border-collapse: collapse;
}

th {

    color: #777;

    text-align: left;

    padding: 15px;

    border-bottom: 1px solid #292e37;
}

td {

    padding: 15px;

    border-bottom: 1px solid #20242b;
}

h1 {

    margin-bottom: 25px;
}

</style>

</head>

<body>

<div class="container">

<a href="/">
← Dashboard
</a>

<h1>Oyuncu Geçmişi</h1>

<div class="card">

<table>

<thead>

<tr>

<th>#</th>

<th>Tarih</th>

<th>Oyuncu</th>

<th>Level</th>

<th>Rank</th>

<th>RP</th>

</tr>

</thead>

<tbody>

{% for record in records %}

<tr>

<td>
{{ record["id"] }}
</td>

<td>
{{ record["recorded_at"] }}
</td>

<td>
{{ record["name"] }}
</td>

<td>
{{ record["level"] }}
</td>

<td>

{{ record["rank_name"] }}

{{ record["rank_div"] }}

</td>

<td>
{{ record["rank_score"] }}
</td>

</tr>

{% endfor %}

</tbody>

</table>

</div>

</div>

</body>

</html>
